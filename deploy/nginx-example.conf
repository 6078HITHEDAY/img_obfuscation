# 子路径部署示例：把整个目录放到 /var/www/tools/hunxiao/
# 粘到站点 server { } 里；如果站点 root 已经是 /var/www/tools，只靠 try_files 也能访问，
# 这段只是显式声明 + 给首页一个不以 / 结尾时的跳转。

location = /hunxiao {
    return 301 /hunxiao/;
}

location /hunxiao/ {
    alias /var/www/tools/hunxiao/;
    index index.html;
    add_header Cache-Control "no-cache";
}
